server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # the back-end: /api/... on this site goes to the Go server (without the /api), so the browser only ever talks to this
  # address (no CORS). API_UPSTREAM is filled in when the container starts (the nginx image's templates).
  location /api/ {
    proxy_pass ${API_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # uploads of course materials and hand-ins (the server allows 50 MB files)
    client_max_body_size 60m;
  }

  # hashed build files never change: cache them for good
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # the app's own routes (/dashboard, /admin/modules, ...) all load index.html; it must never be cached
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
