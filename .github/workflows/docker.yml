name: docker

on:
  push:
    branches:
      - master
      - main

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/xsolla-capstone-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Smoke-test production image
        run: |
          set -eu
          docker build --target web --tag xsolla-capstone-frontend-smoke .
          container_id="$(docker run --detach --publish 18080:80 xsolla-capstone-frontend-smoke)"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:18080/config.js >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Production image did not serve HTTP on port 80" >&2
          exit 1

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: web
