name: docker

on:
  push:
    branches:
      - master
      - main

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Validate LMS API configuration
      - name: Validate LMS API configuration
        env:
          LMS_API_URL: ${{ vars.LMS_API_URL }}
        run: |
          test -n "$LMS_API_URL" || {
            echo "::error::LMS_API_URL is required"
            exit 1
          }

      # <commit sha> on every push; "latest" only from the default branch
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/xsolla-capstone-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: web
          build-args: |
            VITE_API_URL=${{ vars.LMS_API_URL }}
